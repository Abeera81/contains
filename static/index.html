<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contains</title>
<style>
:root{
  --bg:#faf8f5; --surface:#fff; --ink:#1f2328; --muted:#6b7280; --line:#e2ded6;
  --contains:#b42318; --contains-bg:#fdecea;
  --unsure:#8a5a00; --unsure-bg:#fff4d6; --unsure-line:#d19a1e;
  --absent:#5b6470; --absent-bg:#f1f2f4;
  --accent:#1d4e89; --warn-bg:#fff1f0; --warn-line:#e0877f;
  --solid-bg:#1f2328; --solid-ink:#fff;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#14161a; --surface:#1d2025; --ink:#e8e6e1; --muted:#9aa1ab; --line:#33373e;
    --contains:#ff8a80; --contains-bg:#3a1f1d;
    --unsure:#f5c451; --unsure-bg:#3a2f12; --unsure-line:#b88a1c;
    --absent:#aab1bb; --absent-bg:#262a30;
    --accent:#7db4ee; --warn-bg:#3a1f1d; --warn-line:#a8554e;
    --solid-bg:#e8e6e1; --solid-ink:#14161a;
  }
}
:root[data-theme="dark"]{
  --bg:#14161a; --surface:#1d2025; --ink:#e8e6e1; --muted:#9aa1ab; --line:#33373e;
  --contains:#ff8a80; --contains-bg:#3a1f1d;
  --unsure:#f5c451; --unsure-bg:#3a2f12; --unsure-line:#b88a1c;
  --absent:#aab1bb; --absent-bg:#262a30;
  --accent:#7db4ee; --warn-bg:#3a1f1d; --warn-line:#a8554e;
  --solid-bg:#e8e6e1; --solid-ink:#14161a;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
.wrap{max-width:760px;margin:0 auto;padding:0 16px 160px}
h1{font-size:1.5rem;margin:24px 0 2px}
.sub{color:var(--muted);margin:0 0 16px}
textarea{width:100%;min-height:150px;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);font:inherit;resize:vertical}
.row{display:flex;gap:10px;flex-wrap:wrap;margin:10px 0}
button,label.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:10px 16px;border-radius:10px;font:inherit;cursor:pointer}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button:disabled{opacity:.6;cursor:wait}
input[type=file]{display:none}
.banner{margin:14px 0;padding:12px 14px;border:1px solid var(--warn-line);background:var(--warn-bg);border-radius:10px}
.banner b{display:block}
.label{margin:20px 0 6px;border:3px solid var(--ink);background:var(--surface);color:var(--ink)}
.label .line{padding:14px 16px;font-size:clamp(1.4rem,5.4vw,2rem);line-height:1.2;font-weight:800;overflow-wrap:anywhere}
.label .line .k{text-transform:uppercase;letter-spacing:.02em}
.label .verify{padding:10px 16px;border-top:1.5px solid var(--ink);font-size:1rem;font-weight:600;overflow-wrap:anywhere}
.label .verify .k{text-transform:uppercase;font-size:.85rem;letter-spacing:.04em;margin-right:4px}
.label .notes{margin:0;padding:8px 16px 10px 32px;border-top:1px dotted var(--ink);color:var(--muted);font-size:.85rem;font-weight:400}
.ocr{margin:12px 0;font-size:.9rem;color:var(--muted)}
.ocr textarea{min-height:70px;margin-top:4px}
.a{margin-top:12px;padding:10px 12px;border:2px solid var(--ink);border-left-width:8px}
.a.unsure{border:2px dashed var(--unsure-line);border-left:8px dashed var(--unsure-line);background:var(--unsure-bg)}
.a .hd{display:flex;align-items:center;flex-wrap:wrap;gap:8px 10px}
.a .nm{font-weight:700;font-size:1.05rem}
.badge{display:inline-block;padding:1px 10px;border-radius:4px;font-size:.78rem;font-weight:800;letter-spacing:.05em;text-transform:uppercase;white-space:nowrap}
.badge.contains{background:var(--solid-bg);color:var(--solid-ink)}
.badge.unsure{background:transparent;color:var(--unsure);border:2px dashed var(--unsure-line)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{display:inline-flex;align-items:baseline;gap:7px;max-width:100%;padding:2px 10px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:.92rem;font-weight:400;overflow-wrap:anywhere}
.chip .w{font-weight:400}
.chip .tag{font-size:.7rem;font-weight:400;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.chip.infer{font-style:italic}
.lead{align-self:center;font-size:.85rem;color:var(--muted)}
.absent{margin:16px 2px 0;color:var(--muted);font-size:.95rem}
.absent b{font-weight:700}
@media (max-width:480px){button,label.btn{flex:1 1 100%;text-align:center}}
.disclaimer{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:2px solid var(--ink);padding:10px 16px;font-size:.85rem;z-index:5}
.disclaimer div{max-width:760px;margin:0 auto}
.foot{color:var(--muted);font-size:.8rem;margin-top:16px}
</style>
</head>
<body>
<div class="wrap">
  <h1>Contains</h1>
  <p class="sub">Paste a recipe or ingredient list. Get a US-style “Contains:” line, with the evidence.</p>

  <textarea id="text" placeholder="e.g. wheat flour, butter, worcestershire sauce, pistachio spread, vanilla essence" aria-label="Ingredient list or recipe"></textarea>
  <div class="row">
    <button class="primary" id="go">Check allergens</button>
    <label class="btn" for="photo">Upload a label photo</label>
    <input type="file" id="photo" accept="image/*">
  </div>
  <div id="status" class="sub" role="status"></div>
  <div id="out"></div>
  <p class="foot" id="foot"></p>
</div>

<div class="disclaimer" role="note"><div>
  <b>Not a substitute for the manufacturer’s label.</b> Formulation-dependent items (marked <em>unsure</em>) must be confirmed with the supplier.
</div></div>

<script>
const $ = (id) => document.getElementById(id);
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
const STATUS = { contains: "✔ Contains", unsure: "? Unsure" };

function chip(word, tag, cls) {
  const c = el("span", "chip" + (cls ? " " + cls : ""));
  c.appendChild(el("span", "w", word));
  if (tag) c.appendChild(el("span", "tag", tag));
  return c;
}

function chips(a) {
  const box = el("div", "chips");
  if (a.status === "contains") {
    a.evidence.forEach(w => box.appendChild(chip(w, "rules")));
    if (a.layers.includes("model") && a.evidence.length) box.appendChild(chip("agrees", "model"));
    if (a.model_inference_only) box.appendChild(chip("model inference — no matched term", null, "infer"));
  } else if (a.status === "unsure") {
    box.appendChild(el("span", "lead", "unsure, because:"));
    a.unsure_because.forEach(w => box.appendChild(chip(w, "source not named")));
  }
  return box;
}

// "Contains: Milk, Eggs." -> bold keyword + list
function labelLine(text, cls) {
  const d = el("div", cls), i = text.indexOf(":");
  if (i > 0) { d.appendChild(el("span", "k", text.slice(0, i + 1))); d.appendChild(document.createTextNode(text.slice(i + 1))); }
  else d.textContent = text;
  return d;
}

function render(r) {
  const out = $("out"); out.textContent = "";
  if (r.banner) { const b = el("div", "banner"); b.appendChild(el("b", null, "Heads up")); b.appendChild(document.createTextNode(r.banner)); out.appendChild(b); }
  if (r.ocr_error) { out.appendChild(el("div", "banner", r.ocr_error)); return; }
  if (r.empty) { $("foot").textContent = ""; return; }
  if (r.ocr_text) {
    const o = el("div", "ocr", "Read from photo (edit if wrong, then press Check allergens):");
    const t = el("textarea"); t.value = r.ocr_text; t.id = "ocrtext"; o.appendChild(t); out.appendChild(o);
    $("text").value = r.ocr_text;
  }
  const lab = el("div", "label");
  lab.appendChild(labelLine(r.contains_line, "line"));
  if (r.verify_line) lab.appendChild(labelLine(r.verify_line, "verify"));
  if (r.notes.length) { const ul = el("ul", "notes"); r.notes.forEach(n => ul.appendChild(el("li", null, n))); lab.appendChild(ul); }
  out.appendChild(lab);
  if (r.truncated) out.appendChild(el("p", "foot", "Input was long; only the first 6,000 characters were checked."));
  r.allergens.filter(a => a.status !== "absent").forEach(a => {
    const row = el("div", "a " + a.status);
    const hd = el("div", "hd");
    hd.appendChild(el("span", "nm", a.name));
    hd.appendChild(el("span", "badge " + a.status, STATUS[a.status]));
    row.appendChild(hd); row.appendChild(chips(a));
    out.appendChild(row);
  });
  const absent = r.allergens.filter(a => a.status === "absent").map(a => a.name);
  if (absent.length) { const p = el("p", "absent"); p.appendChild(el("b", null, "Absent:")); p.appendChild(document.createTextNode(" " + absent.join(", ") + ".")); out.appendChild(p); }
  $("foot").textContent = r.sampler === "rules_only" ? "Layers used: rules only." : "Layers used: fine-tuned model (" + r.sampler + ") + rules.";
}

async function post(url, body, headers) {
  const res = await fetch(url, { method: "POST", body, headers });
  return res.json();
}
async function run(fn, msg) {
  $("go").disabled = true; $("status").textContent = msg;
  try { render(await fn()); $("status").textContent = ""; }
  catch (e) { $("status").textContent = ""; render({ empty: true, banner: "Couldn’t reach the server. Check your connection and try again.", allergens: [], notes: [] }); }
  $("go").disabled = false;
}
$("go").onclick = () => run(() => post("/api/label", JSON.stringify({ text: ($("ocrtext") || $("text")).value }), { "Content-Type": "application/json" }), "Checking…");
// Photo reading is local-only: if the server can't reach Ollama, say so instead of showing a broken upload.
fetch("/healthz").then(r => r.json()).then(h => {
  if (h.photo === false) {
    const lab = document.querySelector('label[for="photo"]');
    const note = el("span", "sub", "Photo reading is local-only (needs Gemma on your computer). ");
    const a = el("a", null, "How to run it locally"); a.href = "https://github.com/Abeera81/contains#photo-reading-local-only"; a.target = "_blank"; a.rel = "noopener";
    note.appendChild(a); lab.replaceWith(note);
  }
}).catch(() => {});
// "#text=..." prefills and runs (fragment stays in the browser; never sent to the server)
if (location.hash.startsWith("#text=")) { $("text").value = decodeURIComponent(location.hash.slice(6)); $("go").click(); }
$("photo").onchange = (ev) => {
  const f = ev.target.files[0]; if (!f) return;
  run(() => post("/api/photo", f, { "Content-Type": f.type || "application/octet-stream" }), "Reading the photo on this computer (Gemma 3 4B) — this can take a minute…");
  ev.target.value = "";
};
</script>
</body>
</html>
