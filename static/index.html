<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contains</title>
<style>
:root{
  --bg:#faf8f4; --card:#fff; --line:#e6e3dc; --ink:#1b2a4a; --muted:#6b7a99; --faint:#98a3b8; --panel:#f7f8fa;
  --blue:#1f5fb4; --blue-ink:#fff;
  --det-bg:#fde8ec; --det-ink:#c0283d;
  --amb-bg:#fff6e0; --amb-line:#d9a21b; --amb-ink:#7a5200; --amb-pill:#ffefc2;
  --ban-bg:#fdf3e3; --ban-line:#f0dbb5; --ban-pill:#fbe3bd; --ban-pill-ink:#6b4300;
  --warn-bg:#fff1f0; --warn-line:#e0877f;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#12151c; --card:#1b2029; --line:#313846; --ink:#e8ecf5; --muted:#9aa6bf; --faint:#7f8aa3; --panel:#232a37;
    --blue:#6a9bff; --blue-ink:#10151f;
    --det-bg:#4a2326; --det-ink:#ff9d9d;
    --amb-bg:#3a2f12; --amb-line:#b88a1c; --amb-ink:#f5c451; --amb-pill:#4d3d14;
    --ban-bg:#33291a; --ban-line:#5c4a28; --ban-pill:#4d3d14; --ban-pill-ink:#f5d58a;
    --warn-bg:#3a1f1d; --warn-line:#a8554e;
  }
}
:root[data-theme="dark"]{
  --bg:#12151c; --card:#1b2029; --line:#313846; --ink:#e8ecf5; --muted:#9aa6bf; --faint:#7f8aa3; --panel:#232a37;
  --blue:#6a9bff; --blue-ink:#10151f;
  --det-bg:#4a2326; --det-ink:#ff9d9d;
  --amb-bg:#3a2f12; --amb-line:#b88a1c; --amb-ink:#f5c451; --amb-pill:#4d3d14;
  --ban-bg:#33291a; --ban-line:#5c4a28; --ban-pill:#4d3d14; --ban-pill-ink:#f5d58a;
  --warn-bg:#3a1f1d; --warn-line:#a8554e;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif}
.wrap{max-width:660px;margin:0 auto;padding:0 20px 180px}
.brand{display:flex;align-items:center;gap:14px;margin:40px 0 4px}
.brand svg{width:36px;height:40px;flex:none;color:var(--blue)}
.brand h1{font-size:1.8rem;line-height:1;margin:0;letter-spacing:-.01em}
.sub{color:var(--muted);margin:0 0 28px 50px}
textarea{width:100%;min-height:140px;padding:16px 18px;border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink);font:inherit;resize:vertical}
textarea:focus{outline:2px solid var(--blue);outline-offset:1px}
.row{display:flex;gap:12px;flex-wrap:wrap;margin-top:16px;align-items:center}
button,label.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:12px 22px;border-radius:12px;font:inherit;font-weight:600;cursor:pointer}
button.primary{background:var(--blue);border-color:var(--blue);color:var(--blue-ink)}
button svg{width:18px;height:18px;flex:none}
button:disabled{opacity:.6;cursor:wait}
input[type=file]{display:none}
.hint{color:var(--muted);font-size:.9rem}
.hint a{color:var(--blue)}
.banner{margin:20px 0 0;padding:14px 18px;border:1px solid var(--warn-line);background:var(--warn-bg);border-radius:14px}
.banner b{display:block}
hr{border:0;border-top:1px solid var(--line);margin:32px 0 0}
h2.res{font-size:1.25rem;font-weight:800;margin:24px 0 16px;letter-spacing:-.01em}
h2.sec{font-size:.85rem;font-weight:600;color:var(--muted);margin:30px 2px 10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px}
.summary{display:flex;align-items:flex-start;gap:16px;padding:20px 22px;background:var(--ban-bg);border-color:var(--ban-line)}
.summary .sic{width:30px;height:30px;color:var(--amb-ink);flex:none}
.summary .sic svg{width:30px;height:30px}
.summary .st{font-weight:700;font-size:1.06rem;line-height:1.35;padding-top:2px}
.summary small{display:block;font-weight:400;color:var(--muted);font-size:.86rem;margin-top:2px}
.pills{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.pill{padding:3px 14px;border-radius:999px;font-size:.86rem;background:var(--ban-pill);color:var(--ban-pill-ink)}
.pill.q{background:transparent;border:1.5px dashed var(--amb-line);color:var(--amb-ink)}
.label{margin-top:16px;border:2.5px solid var(--ink);border-radius:14px;background:var(--card);overflow:hidden}
.label .top{display:flex;align-items:flex-start;gap:12px;padding:20px 22px}
.label .line{flex:1;font-size:clamp(1.35rem,5vw,1.8rem);line-height:1.25;font-weight:800;overflow-wrap:anywhere}
.label .k{text-transform:uppercase;letter-spacing:.02em}
.label .verify{padding:14px 22px;border-top:1.5px solid var(--ink);font-weight:600;overflow-wrap:anywhere;color:var(--amb-ink);background:var(--amb-bg)}
.label .verify .k{font-size:.82rem;letter-spacing:.05em;margin-right:6px}
.label .notes{margin:0;padding:12px 22px 14px 40px;border-top:1px dotted var(--ink);color:var(--muted);font-size:.86rem}
.copy{padding:7px 14px;font-size:.85rem;border-radius:10px;flex:none}
.copy svg{width:15px;height:15px}
.ocr{margin-top:16px;font-size:.9rem;color:var(--muted)}
.ocr textarea{min-height:70px;margin-top:6px}
details.a{margin-top:14px}
details.a.unsure{background:var(--amb-bg);border:2px dashed var(--amb-line)}
details.a>summary{display:flex;align-items:center;gap:16px;padding:20px 22px;cursor:pointer;list-style:none}
details.a>summary::-webkit-details-marker{display:none}
details.a[open]>summary{padding-bottom:14px}
.chev{margin-left:auto;width:22px;height:22px;color:var(--muted);flex:none}
.chev svg{width:22px;height:22px}
details.a[open] .chev{transform:rotate(180deg)}
.ic{width:44px;height:44px;border-radius:50%;flex:none;display:flex;align-items:center;justify-content:center;color:var(--ic-fg);background:color-mix(in srgb,var(--ic-fg) 15%,var(--card))}
.ic svg{width:28px;height:28px}
.ic-milk{--ic-fg:#2f6fd0}.ic-egg{--ic-fg:#c58a00}.ic-fish{--ic-fg:#1d8f9c}.ic-crustacean_shellfish{--ic-fg:#d0533c}
.ic-tree_nuts{--ic-fg:#8a5a2b}.ic-peanuts{--ic-fg:#b8741f}.ic-wheat{--ic-fg:#4f8f3a}.ic-soy{--ic-fg:#7a9a2e}.ic-sesame{--ic-fg:#7a5cc4}
.nm{font-weight:700;font-size:1.2rem;line-height:1.2}
.badge{display:inline-block;padding:3px 9px;border-radius:6px;font-size:.69rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;white-space:nowrap}
.badge.contains{background:var(--det-bg);color:var(--det-ink)}
.badge.unsure{background:var(--amb-pill);color:var(--amb-ink);box-shadow:inset 0 0 0 1.5px var(--amb-line)}
.ev{margin:0 22px 22px;padding:12px;background:var(--panel);border-radius:12px}
.unsure .ev{background:var(--card)}
.ev .lbl{font-size:.78rem;color:var(--faint);margin:0 0 8px 2px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:baseline;gap:7px;max-width:100%;padding:4px 14px;border-radius:999px;background:var(--card);border:1px solid var(--line);color:var(--ink);font-size:.9rem;overflow-wrap:anywhere}
.chip .tag{color:var(--faint);font-size:.84rem}
.chip .tag::before{content:"\00b7";margin-right:7px}
.chip.infer{font-style:italic}
.why{margin:10px 2px 0;font-size:.88rem;color:var(--amb-ink);font-weight:600}
.none{display:flex;flex-wrap:wrap;gap:8px;margin-top:2px}
.none .chip{background:var(--panel);border-color:transparent;color:var(--muted);font-size:.84rem;padding:3px 14px}
.disclaimer{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:2px solid var(--ink);padding:12px 20px;font-size:.85rem;z-index:5}
.disclaimer div{max-width:660px;margin:0 auto}
.foot{color:var(--muted);font-size:.8rem;margin-top:24px}
@media (max-width:480px){
  .wrap{padding:0 16px 190px}
  button.primary,label.btn{flex:1 1 100%}
  .sub{margin-left:0}
  .summary{padding:16px}
  details.a>summary{padding:16px;gap:12px}
  details.a[open]>summary{padding-bottom:12px}
  .ev{margin:0 16px 16px}
  .label .top{padding:16px}.label .verify{padding:12px 16px}.label .notes{padding:10px 16px 12px 34px}
  .nm{font-size:1.1rem}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">
    <svg viewBox="0 0 34 38" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17 3l12 4.2v8.8c0 7-5 12.2-12 15-7-2.8-12-8-12-15V7.2z"/><path d="M12 24c0-6 4-10 11-11-.5 6-4 10-11 11z"/><path d="M12 24l6-6"/></svg>
    <h1>Contains</h1>
  </div>
  <p class="sub">Check a recipe or ingredient list for common allergens.</p>

  <textarea id="text" placeholder="e.g. wheat flour, butter, worcestershire sauce, pistachio spread, vanilla essence" aria-label="Ingredient list or recipe"></textarea>
  <div class="row">
    <button class="primary" id="go"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="M16 16l4.5 4.5"/></svg>Check allergens</button>
    <label class="btn" for="photo">Upload a label photo</label>
    <input type="file" id="photo" accept="image/*">
  </div>
  <div id="status" class="hint" role="status" style="margin-top:12px"></div>
  <div id="out"></div>
  <p class="foot" id="foot"></p>
</div>

<div class="disclaimer" role="note"><div>
  <b>Not a substitute for the manufacturer’s label.</b> Formulation-dependent items (marked <em>needs checking</em>) must be confirmed with the supplier.
</div></div>

<script>
const $ = (id) => document.getElementById(id);
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e; };
const SV = (inner) => '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + inner + '</svg>';
// static, trusted glyphs (no user data)
const ICON = {
  milk: SV('<path d="M8 3h8l1 4v13a1 1 0 0 1-1 1H8a1 1 0 0 1-1-1V7z"/><path d="M7 11h10"/>'),
  egg: SV('<path d="M12 3c3.5 0 6 5.5 6 10a6 6 0 0 1-12 0c0-4.5 2.5-10 6-10z"/>'),
  fish: SV('<path d="M3 12c3-5 9-6 13-2l5-3v10l-5-3c-4 4-10 3-13-2z"/><circle cx="8" cy="11" r=".8" fill="currentColor"/>'),
  crustacean_shellfish: SV('<path d="M5 14c0-5 4-9 9-9 2 0 4 1 5 2-3 0-5 2-5 5 0 2-1 4-4 5-3 0-5-1-5-3z"/><path d="M9 19l-2 2M12 19l-1 2M15 17l1 3"/>'),
  tree_nuts: SV('<path d="M6 11h12c0 5-3 9-6 10-3-1-6-5-6-10z"/><path d="M5 11a7 5 0 0 1 14 0"/><path d="M12 6V3"/>'),
  peanuts: SV('<circle cx="9" cy="9" r="4.5"/><circle cx="15" cy="15" r="4.5"/>'),
  wheat: SV('<path d="M12 21V8"/><path d="M12 8c-3 0-4-2-4-4 3 0 4 2 4 4zM12 8c3 0 4-2 4-4-3 0-4 2-4 4zM12 13c-3 0-4-2-4-4 3 0 4 2 4 4zM12 13c3 0 4-2 4-4-3 0-4 2-4 4zM12 18c-3 0-4-2-4-4 3 0 4 2 4 4zM12 18c3 0 4-2 4-4-3 0-4 2-4 4z"/>'),
  soy: SV('<path d="M4 15c0-6 5-10 14-10 1 8-3 14-10 14-2 0-4-1-4-4z"/><circle cx="9.5" cy="14" r="1.1"/><circle cx="13" cy="11.5" r="1.1"/><circle cx="15.5" cy="8.5" r="1"/>'),
  sesame: SV('<ellipse cx="8" cy="9" rx="2.2" ry="1.3" transform="rotate(-30 8 9)"/><ellipse cx="16" cy="8" rx="2.2" ry="1.3" transform="rotate(25 16 8)"/><ellipse cx="12" cy="15" rx="2.2" ry="1.3" transform="rotate(-10 12 15)"/>')
};
const ICO_CHECK = SV('<path d="M5 12.5l4.5 4.5L19 7.5"/>');
const ICO_WARN = SV('<path d="M12 3.5l9.5 16.5h-19z"/><path d="M12 10v4.5"/><circle cx="12" cy="17.3" r=".7" fill="currentColor"/>');
const ICO_CHEV = SV('<path d="M6 9l6 6 6-6"/>');
const ICO_COPY = SV('<rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V6a2 2 0 0 1 2-2h9"/>');

function chip(word, tag, cls) {
  const c = el("span", "chip" + (cls ? " " + cls : ""));
  c.appendChild(el("span", "w", word));
  if (tag) c.appendChild(el("span", "tag", tag));
  return c;
}
function chips(a) {
  const box = el("div", "chips");
  if (a.status === "contains") {
    a.evidence.forEach(w => box.appendChild(chip(w, "ingredient rule")));
    if (a.layers.includes("model") && a.evidence.length) box.appendChild(chip("model agrees"));
    if (a.model_inference_only) box.appendChild(chip("model inference — no matched term", null, "infer"));
  } else {
    a.unsure_because.forEach(w => box.appendChild(chip(w, "source not named")));
  }
  return box;
}
function labelLine(text, cls) {
  const d = el("div", cls), i = text.indexOf(":");
  if (i > 0) { d.appendChild(el("span", "k", text.slice(0, i + 1))); d.appendChild(document.createTextNode(text.slice(i + 1))); }
  else d.textContent = text;
  return d;
}
function copyText(t, btn) {
  const done = () => { btn.lastChild.textContent = "Copied"; setTimeout(() => { btn.lastChild.textContent = "Copy"; }, 1800); };
  if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(t).then(done, () => {});
  else { const ta = el("textarea"); ta.value = t; document.body.appendChild(ta); ta.select(); try { document.execCommand("copy"); done(); } catch (e) {} ta.remove(); }
}
function summary(C, U, N) {
  const s = el("div", "card summary");
  const ic = el("span", "sic"); ic.innerHTML = (C.length || U.length) ? ICO_WARN : ICO_CHECK; s.appendChild(ic);
  const t = el("div");
  const head = (C.length || U.length)
    ? C.length + (C.length === 1 ? " allergen" : " allergens") + " detected" + (U.length ? " · " + U.length + " need checking" : "")
    : "No major allergens detected";
  t.appendChild(el("div", "st", head));
  t.appendChild(el("small", null, N.length + " of 9 not detected in this list"));
  if (C.length || U.length) {
    const p = el("div", "pills");
    C.forEach(a => p.appendChild(el("span", "pill", a.name)));
    U.forEach(a => p.appendChild(el("span", "pill q", a.name + " (check)")));
    t.appendChild(p);
  }
  s.appendChild(t);
  return s;
}

function render(r) {
  const out = $("out"); out.textContent = "";
  if (r.banner) { const b = el("div", "banner"); b.appendChild(el("b", null, "Heads up")); b.appendChild(document.createTextNode(r.banner)); out.appendChild(b); }
  if (r.ocr_error) { out.appendChild(el("div", "banner", r.ocr_error)); return; }
  if (r.empty) { $("foot").textContent = ""; return; }
  if (r.ocr_text) {
    const o = el("div", "ocr", "Read from photo (edit if wrong, then press Check allergens):");
    const t = el("textarea"); t.value = r.ocr_text; t.id = "ocrtext"; o.appendChild(t); out.appendChild(o);
    $("text").value = r.ocr_text;
  }
  const C = r.allergens.filter(a => a.status === "contains"), U = r.allergens.filter(a => a.status === "unsure"), N = r.allergens.filter(a => a.status === "absent");
  out.appendChild(el("hr"));
  out.appendChild(el("h2", "res", "Allergen results"));
  out.appendChild(summary(C, U, N));

  const lab = el("div", "label"), top = el("div", "top");
  top.appendChild(labelLine(r.contains_line, "line"));
  const cb = el("button", "copy"); cb.type = "button"; cb.innerHTML = ICO_COPY; cb.appendChild(el("span", null, "Copy"));
  cb.setAttribute("aria-label", "Copy the Contains line"); cb.onclick = () => copyText(r.contains_line + (r.verify_line ? "\n" + r.verify_line : ""), cb);
  top.appendChild(cb); lab.appendChild(top);
  if (r.verify_line) lab.appendChild(labelLine(r.verify_line, "verify"));
  if (r.notes.length) { const ul = el("ul", "notes"); r.notes.forEach(n => ul.appendChild(el("li", null, n))); lab.appendChild(ul); }
  out.appendChild(lab);
  if (r.truncated) out.appendChild(el("p", "foot", "Input was long; only the first 6,000 characters were checked."));

  const card = (a) => {
    const c = el("details", "card a " + a.status); c.open = true;
    const sm = el("summary");
    const ic = el("div", "ic ic-" + a.key); ic.innerHTML = ICON[a.key]; sm.appendChild(ic);
    sm.appendChild(el("span", "nm", a.name));
    sm.appendChild(el("span", "badge " + a.status, a.status === "contains" ? "Detected" : "Needs checking"));
    const ch = el("span", "chev"); ch.innerHTML = ICO_CHEV; sm.appendChild(ch);
    c.appendChild(sm);
    const ev = el("div", "ev"); ev.appendChild(el("div", "lbl", a.status === "contains" ? "Evidence" : "Trigger ingredient"));
    ev.appendChild(chips(a));
    if (a.status === "unsure") ev.appendChild(el("p", "why", "Source not named; confirm with supplier."));
    c.appendChild(ev); return c;
  };
  C.forEach(a => out.appendChild(card(a)));
  U.forEach(a => out.appendChild(card(a)));
  if (N.length) {
    out.appendChild(el("h2", "sec", "Not detected in this list"));
    const row = el("div", "none"); N.forEach(a => row.appendChild(chip(a.name))); out.appendChild(row);
  }
  $("foot").textContent = r.sampler === "rules_only"
    ? "Detection used ingredient rules only (the model layer was not used). Always verify labels for severe allergies."
    : "Detection uses ingredient rules and a fine-tuned model. Always verify labels for severe allergies.";
}

async function post(url, body, headers) {
  const res = await fetch(url, { method: "POST", body, headers });
  return res.json();
}
async function run(fn, msg) {
  $("go").disabled = true; $("status").textContent = msg;
  try { render(await fn()); $("status").textContent = ""; }
  catch (e) { $("status").textContent = ""; render({ empty: true, banner: "Couldn’t reach the server. Check your connection and try again.", allergens: [], notes: [] }); }
  $("go").disabled = false;
}
$("go").onclick = () => run(() => post("/api/label", JSON.stringify({ text: ($("ocrtext") || $("text")).value }), { "Content-Type": "application/json" }), "Checking…");
// Photo reading is local-only: if the server can't reach Ollama, say so instead of showing a broken upload.
fetch("/healthz").then(r => r.json()).then(h => {
  if (h.photo === false) {
    const lab = document.querySelector('label[for="photo"]');
    const note = el("span", "hint", "Photo reading is local-only (needs Gemma on your computer). ");
    const a = el("a", null, "How to run it locally"); a.href = "https://github.com/Abeera81/contains#photo-reading-local-only"; a.target = "_blank"; a.rel = "noopener";
    note.appendChild(a); lab.replaceWith(note);
  }
}).catch(() => {});
// "#text=..." prefills and runs (fragment stays in the browser; never sent to the server)
if (location.hash.startsWith("#text=")) { $("text").value = decodeURIComponent(location.hash.slice(6)); $("go").click(); }
$("photo").onchange = (ev) => {
  const f = ev.target.files[0]; if (!f) return;
  run(() => post("/api/photo", f, { "Content-Type": f.type || "application/octet-stream" }), "Reading the photo on this computer (Gemma 3 4B) — this can take a minute…");
  ev.target.value = "";
};
</script>
</body>
</html>
