[project]
name = "contains"
version = "0.1.0"
description = "A fine-tuned 4B open model + rules layer that labels the 9 US major food allergens, including allergens hidden inside compound ingredients."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "MIT" }
dependencies = [
    "tinker",
    "duckdb>=1.1",
    "pyarrow>=17",
    "pandas>=2.2",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "pillow>=10.4",
    "matplotlib>=3.9",
    "python-dotenv>=1.0",
    "jinja2>=3.1",
]

[project.optional-dependencies]
# tinker-cookbook pins tml-renderers==0.2.0, which ships no Windows wheel
# (Linux + macOS only). It is therefore an extra: installed on Render/Linux and
# for training runs, not during Windows local dev. The Tinker SDK (training +
# sampling) works on Windows without it.
train = [
    "tinker-cookbook",
]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/contains"]

[tool.uv]
# tinker-cookbook is distributed from GitHub (Apache-2.0); tinker is its runtime dep.
# If the PyPI name resolves, uv uses it; otherwise pin the git source here.
[tool.uv.sources]
tinker-cookbook = { git = "https://github.com/thinking-machines-lab/tinker-cookbook" }

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint.per-file-ignores]
# Smoke/diagnostic scripts intentionally use broad excepts and implicit string
# concatenation so one failing probe prints FAIL rather than crashing the run.
"scripts/*" = ["BLE001", "S110", "ISC004"]

[dependency-groups]
dev = [
    "langdetect>=1.0.9",
]
